{% extends "base.html" %}
{% load static %}
{% load widget_tweaks %}
{% block content %}
<h2 class="mb-4">Ask a Question</h2>
<div class="card p-4">
    <form method="post">
        {% csrf_token %}
        {% for field in form %}
            <div class="mb-3">
                {{ field.label_tag }}
                {{ field|add_class:"form-control" }}
                {% if field.errors %}
                    <div class="text-danger">{{ field.errors }}</div>
                {% endif %}
            </div>
        {% endfor %}
        <button type="submit" class="btn btn-danger">Post Question</button>
    </form>
</div>
{% endblock %}
