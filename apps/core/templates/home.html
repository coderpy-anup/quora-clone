{% extends "base.html" %}
{% load static %}
{% block content %}
    <div class="text-center">
        <h1 class="display-4 text-danger">Welcome to Quora Clone</h1>
        <p class="lead">Ask questions, share answers, and grow your knowledge.</p>
        {% if user.is_authenticated %}
            <a href="{% url 'core:question_list' %}" class="btn btn-danger btn-lg mt-3">Browse Questions</a>
        {% else %}
            <a href="{% url 'core:register' %}" class="btn btn-danger btn-lg mt-3">Get Started</a>
        {% endif %}
    </div>
{% endblock %}
